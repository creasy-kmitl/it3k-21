name: Deploy

on:
  push:
    branches: [prod, main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # `--stage` is deliberately not passed: alchemy falls back to ALCHEMY_STAGE,
  # and alchemy.run.ts reads the same variable to derive its hostnames.
  #   PR         -> pr-<number>
  #   push prod  -> prod
  #   push main  -> staging
  ALCHEMY_STAGE: >-
    ${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || (github.ref_name == 'prod' && 'prod' || 'staging') }}
  NODE_ENV: production

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:biome
      # Not `bun run check`: that also runs the formatter, which currently
      # fails on ~24 files that predate this workflow. Run `vp check --fix`
      # across the repo, then swap this for `bun run check`.
      - run: bun run check-types

  deploy:
    # Deliberately not `needs: check` yet — `check-types` fails on two
    # pre-existing errors in apps/web (the `cn` import in src/lib/utils.ts and
    # an unused `Header` in routes/__root.tsx). Fix those, then add
    # `needs: check` here so a red build can't reach prod.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Deploy
        working-directory: packages/infra
        # `--yes` also makes alchemy bootstrap a brand-new, empty state store
        # whenever its probe can't reach the existing one -- which is how
        # every stage's state was lost on 2026-09-19. With empty state a
        # long-lived stage redeploys from scratch: a fresh D1 next to the
        # live one, then a hostname collision. So `staging` and `prod` must
        # already be in state before we deploy them. `state ls` runs without
        # `--yes`, so in CI it fails instead of bootstrapping.
        #
        # To rebuild a stage on purpose, set the repo variable
        # ALLOW_FRESH_STAGE to its name for one run, then delete it.
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # A stage with no state exits 1 ("path does not exist"), same as an
            # unreachable store. Both mean "not in state", and both are blocked.
            listing=$(bun alchemy state ls "it3k/$ALCHEMY_STAGE" --no-input 2>&1) || true
            if ! grep -q "^it3k/$ALCHEMY_STAGE/" <<<"$listing"; then
              if [ "${ALLOW_FRESH_STAGE:-}" = "$ALCHEMY_STAGE" ]; then
                echo "::warning::'$ALCHEMY_STAGE' has no state; deploying it fresh (ALLOW_FRESH_STAGE)."
              else
                echo "::error::'$ALCHEMY_STAGE' has no state in the store. Refusing to deploy a second copy of it. See the comment on this step."
                exit 1
              fi
            fi
          fi
          bun alchemy deploy --yes
        env:
          ALLOW_FRESH_STAGE: ${{ vars.ALLOW_FRESH_STAGE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          OAUTH_PROXY_SECRET: ${{ secrets.OAUTH_PROXY_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET_ID: ${{ secrets.GOOGLE_SECRET_ID }}
          PULL_REQUEST: ${{ github.event.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # `refs/pull/<n>/merge` is what checkout picks by default on a
          # `pull_request` event, and GitHub deletes that ref when the PR
          # closes -- which is this job's own trigger. The race is real and
          # a lost one leaks the stage's workers with nothing to retry it.
          # `refs/pull/<n>/head` is kept forever, even after the branch is
          # deleted, so the job can always reach the code it must destroy.
          ref: refs/pull/${{ github.event.number }}/head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Safety check
        run: |
          case "$ALCHEMY_STAGE" in
            prod|staging)
              echo "Refusing to destroy '$ALCHEMY_STAGE' from the cleanup job."
              exit 1
              ;;
          esac
      - name: Destroy preview
        working-directory: packages/infra
        # Retried because a half-destroyed stage is worse than a failed one:
        # alchemy has already torn down part of the graph, and nothing
        # re-runs this job on its own. `destroy` is idempotent over state, so
        # a second pass picks up whatever the first left behind. Anything
        # still standing after three tries is left to `sweep-previews.yml`.
        run: |
          for attempt in 1 2 3; do
            if bun alchemy destroy --yes --no-input; then
              exit 0
            fi
            echo "::warning::destroy attempt $attempt for '$ALCHEMY_STAGE' failed"
            sleep $((attempt * 30))
          done
          echo "::error::could not destroy '$ALCHEMY_STAGE'; the nightly sweep will retry"
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          OAUTH_PROXY_SECRET: ${{ secrets.OAUTH_PROXY_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET_ID: ${{ secrets.GOOGLE_SECRET_ID }}
