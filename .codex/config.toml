[mcp_servers.better-auth]
url = "https://mcp.better-auth.com/mcp"

[mcp_servers.better-t-stack]
command = "bunx"
args = [
    "create-better-t-stack@latest",
    "mcp",
]

[mcp_servers.cloudflare-docs]
url = "https://docs.mcp.cloudflare.com/mcp"

[mcp_servers.context7]
command = "npx"
args = [
    "-y",
    "@upstash/context7-mcp",
]

[mcp_servers.shadcn]
command = "npx"
args = [
    "-y",
    "shadcn@latest",
    "mcp",
]
